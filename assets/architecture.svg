<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#F5F7FA" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2342">Autonomous Business Intelligence Platform — Architecture</text>
  <line x1="60" y1="50" x2="840" y2="50" stroke="#00A8A8" stroke-width="2"/>

  <!-- User Layer -->
  <rect x="60" y="70" width="780" height="70" rx="8" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="450" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#0A2342">USER INTERFACE LAYER</text>
  <rect x="100" y="100" width="140" height="28" rx="6" fill="#4A90D9"/>
  <text x="170" y="119" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Executive Dashboard</text>
  <rect x="260" y="100" width="140" height="28" rx="6" fill="#4A90D9"/>
  <text x="330" y="119" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Manager Dashboard</text>
  <rect x="420" y="100" width="140" height="28" rx="6" fill="#4A90D9"/>
  <text x="490" y="119" text-anchor="middle" font-size="10" fill="white" font-weight="bold">NL Query Interface</text>
  <rect x="580" y="100" width="120" height="28" rx="6" fill="#4A90D9"/>
  <text x="640" y="119" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Anomaly Feed</text>
  <rect x="716" y="100" width="104" height="28" rx="6" fill="#4A90D9"/>
  <text x="768" y="119" text-anchor="middle" font-size="10" fill="white" font-weight="bold">PDF Reports</text>

  <!-- Arrow down -->
  <line x1="450" y1="140" x2="450" y2="165" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent Orchestrator -->
  <rect x="240" y="166" width="420" height="46" rx="8" fill="#0A2342"/>
  <text x="450" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AGENT ORCHESTRATOR</text>
  <text x="450" y="202" text-anchor="middle" font-size="9" fill="#A0B4C8">Sequences agents · Handles failures · Assembles final response</text>

  <!-- Arrow down to agents -->
  <line x1="450" y1="212" x2="450" y2="232" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Three Agents -->
  <!-- SQL Agent -->
  <rect x="60" y="234" width="240" height="100" rx="8" fill="white" stroke="#00A8A8" stroke-width="2"/>
  <rect x="60" y="234" width="240" height="26" rx="8" fill="#00A8A8"/>
  <text x="180" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AGENT 1 — SQL AGENT</text>
  <text x="180" y="272" text-anchor="middle" font-size="9" fill="#555">Natural language → SQL</text>
  <text x="180" y="286" text-anchor="middle" font-size="9" fill="#555">Schema-aware query gen</text>
  <text x="180" y="300" text-anchor="middle" font-size="9" fill="#555">Self-correction on error</text>
  <text x="180" y="314" text-anchor="middle" font-size="9" fill="#555">LLaMA 3.3 70b · Temp=0</text>

  <!-- Analyst Agent -->
  <rect x="330" y="234" width="240" height="100" rx="8" fill="white" stroke="#00A8A8" stroke-width="2"/>
  <rect x="330" y="234" width="240" height="26" rx="8" fill="#00A8A8"/>
  <text x="450" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AGENT 2 — ANALYST</text>
  <text x="450" y="272" text-anchor="middle" font-size="9" fill="#555">Statistical interpretation</text>
  <text x="450" y="286" text-anchor="middle" font-size="9" fill="#555">Pattern &amp; trend detection</text>
  <text x="450" y="300" text-anchor="middle" font-size="9" fill="#555">Anomaly flagging</text>
  <text x="450" y="314" text-anchor="middle" font-size="9" fill="#555">LLaMA 3.3 70b · Temp=0.2</text>

  <!-- Advisor Agent -->
  <rect x="600" y="234" width="240" height="100" rx="8" fill="white" stroke="#00A8A8" stroke-width="2"/>
  <rect x="600" y="234" width="240" height="26" rx="8" fill="#00A8A8"/>
  <text x="720" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="white">AGENT 3 — ADVISOR</text>
  <text x="720" y="272" text-anchor="middle" font-size="9" fill="#555">Strategic recommendations</text>
  <text x="720" y="286" text-anchor="middle" font-size="9" fill="#555">Role-aware (Exec / Mgr)</text>
  <text x="720" y="300" text-anchor="middle" font-size="9" fill="#555">Priority scoring</text>
  <text x="720" y="314" text-anchor="middle" font-size="9" fill="#555">LLaMA 3.3 70b · Temp=0.35</text>

  <!-- Pipeline flow arrows between agents -->
  <line x1="300" y1="284" x2="330" y2="284" stroke="#00A8A8" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="570" y1="284" x2="600" y2="284" stroke="#00A8A8" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Bottom row: Data + Memory layers -->
  <!-- Database -->
  <rect x="60" y="370" width="200" height="80" rx="8" fill="white" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="160" y="392" text-anchor="middle" font-size="10" font-weight="bold" fill="#0A2342">LIVE DATABASE</text>
  <text x="160" y="408" text-anchor="middle" font-size="9" fill="#555">PostgreSQL / Supabase</text>
  <text x="160" y="422" text-anchor="middle" font-size="9" fill="#555">IBM HR + Sales data</text>
  <text x="160" y="436" text-anchor="middle" font-size="9" fill="#555">SQLAlchemy connection pool</text>

  <!-- ChromaDB -->
  <rect x="280" y="370" width="200" height="80" rx="8" fill="white" stroke="#9B59B6" stroke-width="1.5"/>
  <text x="380" y="392" text-anchor="middle" font-size="10" font-weight="bold" fill="#0A2342">MEMORY STORE</text>
  <text x="380" y="408" text-anchor="middle" font-size="9" fill="#555">ChromaDB (persistent)</text>
  <text x="380" y="422" text-anchor="middle" font-size="9" fill="#555">Interaction history</text>
  <text x="380" y="436" text-anchor="middle" font-size="9" fill="#555">Semantic retrieval</text>

  <!-- Anomaly Monitor -->
  <rect x="500" y="370" width="200" height="80" rx="8" fill="white" stroke="#E67E22" stroke-width="1.5"/>
  <text x="600" y="392" text-anchor="middle" font-size="10" font-weight="bold" fill="#0A2342">ANOMALY MONITOR</text>
  <text x="600" y="408" text-anchor="middle" font-size="9" fill="#555">Z-score detection</text>
  <text x="600" y="422" text-anchor="middle" font-size="9" fill="#555">Group comparison</text>
  <text x="600" y="436" text-anchor="middle" font-size="9" fill="#555">Proactive alerts</text>

  <!-- Groq API -->
  <rect x="720" y="370" width="160" height="80" rx="8" fill="white" stroke="#F39C12" stroke-width="1.5"/>
  <text x="800" y="392" text-anchor="middle" font-size="10" font-weight="bold" fill="#0A2342">GROQ API</text>
  <text x="800" y="408" text-anchor="middle" font-size="9" fill="#555">LLaMA 3.3 70b</text>
  <text x="800" y="422" text-anchor="middle" font-size="9" fill="#555">Versatile model</text>
  <text x="800" y="436" text-anchor="middle" font-size="9" fill="#555">~400 tok/sec</text>

  <!-- Connect lines from agents to data layer -->
  <line x1="180" y1="334" x2="180" y2="370" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="380" y1="334" x2="380" y2="370" stroke="#9B59B6" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="334" x2="600" y2="370" stroke="#E67E22" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="334" x2="800" y2="370" stroke="#F39C12" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Legend row -->
  <rect x="60" y="475" width="780" height="60" rx="8" fill="white" stroke="#D0D7E2" stroke-width="1"/>
  <text x="90" y="495" font-size="9" font-weight="bold" fill="#0A2342">STACK:</text>
  <text x="135" y="495" font-size="9" fill="#555">Python 3.10+</text>
  <text x="215" y="495" font-size="9" fill="#555">LangChain</text>
  <text x="280" y="495" font-size="9" fill="#555">Groq API</text>
  <text x="340" y="495" font-size="9" fill="#555">PostgreSQL / Supabase</text>
  <text x="480" y="495" font-size="9" fill="#555">ChromaDB</text>
  <text x="550" y="495" font-size="9" fill="#555">Streamlit</text>
  <text x="615" y="495" font-size="9" fill="#555">ReportLab</text>
  <text x="685" y="495" font-size="9" fill="#555">Plotly</text>
  <text x="735" y="495" font-size="9" fill="#555">SciPy</text>

  <text x="90" y="516" font-size="9" font-weight="bold" fill="#0A2342">DEPLOY:</text>
  <text x="140" y="516" font-size="9" fill="#555">Streamlit Cloud (free tier)  ·  Supabase (free tier)  ·  GitHub Actions CI</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A8A8A"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00A8A8"/>
    </marker>
  </defs>
</svg>
